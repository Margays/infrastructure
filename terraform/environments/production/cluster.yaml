kind: TalosCluster
spec:
  name: orion
  cluster:
    kubernetes_version: v1.36.0
    endpoint: "https://192.168.4.15:6443"
    image: "https://factory.talos.dev/image/9c1d1b442d73f96dcd04e81463eb20000ab014062d22e1b083e1773336bc1dd5/v1.13.7/metal-amd64.iso"
  nodes:
    - name: "talos01"
      role: controlplane
      proxmox_node_name: "odroid02"
      network:
        address: "10.0.0.2"
        gateway: "10.0.0.1"
        bridge: "vmbr0"
        mac_address: "BC:24:11:03:81:29"
        vlan_id: 1000
      resources:
        cpu: 4
        memory: 8192
        disk: 32
    - name: "talos02"
      role: worker
      proxmox_node_name: "odroid02"
      network:
        address: "10.0.0.3"
        gateway: "10.0.0.1"
        bridge: "vmbr0"
        mac_address: "BC:24:11:28:D5:26"
        vlan_id: 1000
      resources:
        cpu: 4
        memory: 8192
        disk: 32
    - name: "talos03"
      role: worker
      proxmox_node_name: "odroid02"
      network:
        address: "10.0.0.4"
        gateway: "10.0.0.1"
        bridge: "vmbr0"
        mac_address: "BC:24:11:62:09:59"
        vlan_id: 1000
      resources:
        cpu: 4
        memory: 8192
        disk: 32
  config_patches_directory: "patches"
  manifests:
    - name: cilium
      type: helm
      phase: bootstrap
      namespace: kube-system
      chart: cilium
      version: 1.19.6
      repository: https://helm.cilium.io
      values:
        ipam:
          mode: kubernetes
        l7Proxy: true
        kubeProxyReplacement: true
        k8sServiceHost: 10.0.0.2
        k8sServicePort: 6443
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        ingressController:
          enabled: true

          # Makes the cilium IngressClass the default.
          default: true

          # One shared Envoy listener and LoadBalancer Service.
          loadbalancerMode: shared

          # Redirect HTTP to HTTPS when an Ingress defines TLS.
          enforceHttps: true

          service:
            name: cilium-ingress
            type: LoadBalancer

            # Required/recommended with Cilium L2 announcements.
            externalTrafficPolicy: Cluster

            # Avoid allocating unnecessary NodePorts if all access is
            # through Cilium's LB datapath.
            allocateLoadBalancerNodePorts: false

            labels:
              exposure.cilium.io/type: ingress

            annotations:
              # Request the fixed address from Cilium LB IPAM.
              lbipam.cilium.io/ips: "10.0.0.254"

        l2announcements:
          enabled: true

        # L2 announcements use Kubernetes leases and increase API traffic.
        # Adjust these for the number of announced Services.
        k8sClientRateLimit:
          qps: 20
          burst: 40
  flux:
    url: "ssh://git@github.com/Margays/infrastructure.git"
    path: "flux/clusters/production"
    username: "git"
    private_key_file: "/home/lukaszwencel/.ssh/id_ed25519"
    patch_file: null
