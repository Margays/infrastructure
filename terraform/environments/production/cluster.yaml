kind: TalosCluster
spec:
  name: orion
  cluster:
    kubernetes_version: v1.36.0
    endpoint: "https://192.168.4.15:6443"
    image: "https://factory.talos.dev/image/9c1d1b442d73f96dcd04e81463eb20000ab014062d22e1b083e1773336bc1dd5/v1.13.7/metal-amd64.iso"
    network:
      cni:
        name: "none"
      proxy:
        disabled: false
  nodes:
    - name: "talos01"
      role: controlplane
      network:
        address: "192.168.4.15"
        bridge: "vmbr0"
        mac_address: "BC:24:11:03:81:29"
        vlan_id: 104
      resources:
        cpu: 4
        memory: 8192
        disk: 32
    - name: "talos02"
      role: worker
      network:
        address: "192.168.4.16"
        bridge: "vmbr0"
        mac_address: "BC:24:11:28:D5:26"
        vlan_id: 104
      resources:
        cpu: 4
        memory: 8192
        disk: 32
    - name: "talos03"
      role: worker
      network:
        address: "192.168.4.17"
        bridge: "vmbr0"
        mac_address: "BC:24:11:62:09:59"
        vlan_id: 104
      resources:
        cpu: 4
        memory: 8192
        disk: 32
  config_patches_directory: "patches"
  manifests: []
    - name: cilium
      type: helm
      phase: bootstrap
      namespace: kube-system
      chart: cilium
      version: 1.19.6
      repository: https://helm.cilium.io
      values:
        ipam:
          mode: kubernetes
        kubeProxyReplacement: false
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
  flux:
    url: "ssh://git@github.com/Margays/infrastructure.git"
    path: "flux/clusters/production"
    username: "git"
    private_key_file: "/home/lukaszwencel/.ssh/id_ed25519"
    patch_file: null
