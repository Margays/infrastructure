        bridge: "vmbr0"
        mac_address: "BC:24:11:28:D5:26"
        vlan_id: 104
      resources:
        cpu: 4
        memory: 8192
        disk: 32
    - name: "talos03"
      role: controlplane
      network:
        address: "192.168.4.17"
        bridge: "vmbr0"
        mac_address: "BC:24:11:62:09:59"
        vlan_id: 104
      resources:
        cpu: 4
        memory: 8192
        disk: 32
  helm:
    helm_release:
      name: cilium
      namespace: kube-system
      chart: cilium
      version: 1.19.6
      repository: https://helm.cilium.io
      values:
        kubeProxyReplacement: false
