cluster:
  inlineManifests:
    - name: external-secrets-namespace
      contents: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: external-secrets

    - name: external-secrets-service-account
      contents: |
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: external-secrets
          namespace: external-secrets

    - name: external-secrets-cluster-role-binding
      contents: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: role-tokenreview-binding
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: system:auth-delegator
        subjects:
        - kind: ServiceAccount
          name: external-secrets
          namespace: external-secrets

    - name: external-secrets-token-requester-cluster-role
      contents: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: external-secrets-token-requester
        rules:
        - apiGroups: [""]
          resources: ["serviceaccounts/token"]
          resourceNames: ["external-secrets"]
          verbs: ["create"]

    - name: external-secrets-token-requester-cluster-role-binding
      contents: |
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: external-secrets-token-requester
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: external-secrets-token-requester
        subjects:
        - kind: ServiceAccount
          name: external-secrets
          namespace: external-secrets

    - name: external-secrets-token
      contents: |
        apiVersion: v1
        kind: Secret
        metadata:
          name: external-secrets-token
          namespace: external-secrets
          annotations:
            kubernetes.io/service-account.name: external-secrets-sa
        type: kubernetes.io/service-account-token
