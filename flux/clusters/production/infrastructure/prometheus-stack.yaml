apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-stack
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-config
  interval: 1h
  retryInterval: 10m
  timeout: 15m
  path: ./flux/infrastructure/prometheus/overlays/production
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
