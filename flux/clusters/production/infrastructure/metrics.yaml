---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-metrics
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-stack
  interval: 1h
  retryInterval: 10m
  timeout: 15m
  path: ./flux/infrastructure/metrics/flux/overlays/production
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
