apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 5m
  timeout: 10m
  path: ./flux/infrastructure/cnpg/overlays/production
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
