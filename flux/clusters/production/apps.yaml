apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  path: ./flux/apps/production
  prune: true
  wait: true
  dependsOn:
    - name: cnpg
    - name: storage
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
