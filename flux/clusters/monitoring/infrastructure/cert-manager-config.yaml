apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-config
    - name: cert-manager-controller
  interval: 30m
  retryInterval: 5m
  timeout: 10m
  path: ./flux/infrastructure/cert-manager/config/overlays/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
