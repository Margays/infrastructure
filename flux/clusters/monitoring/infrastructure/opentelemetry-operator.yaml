apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opentelemetry-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: victoria-stack
  interval: 1h
  retryInterval: 10m
  timeout: 15m
  path: ./flux/infrastructure/opentelemetry/operator/overlays/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
