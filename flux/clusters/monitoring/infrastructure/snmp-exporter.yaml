apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: snmp-exporter
  namespace: flux-system
spec:
  dependsOn:
    - name: prometheus-stack
    - name: external-secrets-config
  interval: 1h
  retryInterval: 10m
  timeout: 15m
  path: ./flux/infrastructure/snmp-exporter/overlays/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
