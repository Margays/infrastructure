apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-controller
  interval: 30m
  retryInterval: 5m
  timeout: 5m
  path: ./flux/infrastructure/metrics-server/overlays/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
