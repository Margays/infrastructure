apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly
  namespace: flux-system
spec:
  dependsOn:
    - name: storage
  interval: 1h
  retryInterval: 10m
  timeout: 15m
  path: ./flux/infrastructure/dragonfly/overlays/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
