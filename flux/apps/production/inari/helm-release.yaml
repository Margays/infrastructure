apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inari
spec:
  chart:
    spec:
      chart: inari
      sourceRef:
        kind: HelmRepository
        name: helm-charts-internal
      version: 0.4.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    ingress:
      enabled: true
      className: cilium
      host: inari.margays.dev
      tlsSecretName: inari-tls
    postgresql:
      podSecurityContext:
        # Match the production NFS data-directory owner.
        runAsNonRoot: true
        runAsUser: 1024
        runAsGroup: 100
        fsGroup: 100
  interval: 1h
