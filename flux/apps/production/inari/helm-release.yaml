apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inari
spec:
  chart:
    spec:
      chart: inari
      sourceRef:
        kind: HelmRepository
        name: helm-charts-internal
      version: ">=0.9.0 <1.0.0"
      interval: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    backend:
      mcpEnabled: true
      resources:
        limits:
          # Allow headroom for decoding and resizing uploaded images.
          memory: 1Gi
    ingress:
      enabled: true
      mcpEnabled: true
      className: cilium
      host: inari.margays.dev
      tlsSecretName: inari-tls
    postgresql:
      podSecurityContext:
        # Match the production NFS data-directory owner.
        runAsNonRoot: true
        runAsUser: 1024
        runAsGroup: 100
        fsGroup: 100
  interval: 1h
