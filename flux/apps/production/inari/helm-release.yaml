apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: inari
spec:
  chart:
    spec:
      chart: inari
      sourceRef:
        kind: HelmRepository
        name: helm-charts-internal
      version: 0.3.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values: {}
  interval: 1h
