apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  chart:
    spec:
      chart: metrics-server
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      version: 3.13.1
  values:
    apiService:
      insecureSkipTLSVerify: false
    tls:
      type: cert-manager
    args:
      - --kubelet-insecure-tls
  interval: 1h
