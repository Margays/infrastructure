apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: victoria-stack
  namespace: victoria-metrics
spec:
  secretName: victoria-stack-tls
  issuerRef:
    name: cloudflare-dns01-issuer
    kind: ClusterIssuer
  dnsNames:
    - logs.monitoring.lab.margays.dev
    - metrics.monitoring.lab.margays.dev
    - traces.monitoring.lab.margays.dev
