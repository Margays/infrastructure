apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/nfs

patches:
  - target:
      kind: HelmRelease
      name: nfs-subdir-external-provisioner
    patch: |-
      - op: replace
        path: /spec/values/nfs/path
        value: /volume2/nfs/clusters/production
      - op: replace
        path: /spec/values/nfs/server
        value: 192.168.2.2
