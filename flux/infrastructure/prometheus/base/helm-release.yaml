apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      version: 88.3.0
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  values:
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi
              storageClassName: nfs-client
    prometheus:
      enabled: true
      retention: 12h
      prometheusSpec:
        remoteWrite:
          - url: http://victoriametrics-cluster-vminsert.victoria-metrics.svc:8480/insert/0/prometheus/api/v1/write
            tlsConfig:
              insecureSkipVerify: true
            writeRelabelConfigs:
              - action: replace
                replacement: "unknown-cluster"
                sourceLabels: []
                targetLabel: data_source
    kubeProxy:
      enabled: false
    grafana:
      enabled: false
      sidecar:
        datasources:
          url: http://victoria-metrics-cluster-vmselect.victoria-metrics.svc:8481/select/0/prometheus
      ingress:
        enabled: true
        ingressClassName: cilium
        hosts: &grafana-hosts
          - grafana.monitoring.lab.margays.dev
        tls:
          - secretName: grafana-tls
            hosts: *grafana-hosts
    
  interval: 1h
